<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cat Breeds Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="cat-container">
        
        
        <div class="cat-breed">
            <img src="https://unsplash.com" alt="Ragdoll Cat">
            <h3>Ragdoll</h3>
            <p>Gentle and floppy with a soft plush coat and remarkably docile nature.</p>
        </div>

        
        <div class="cat-breed">
            <img src="https://unsplash.com" alt="Siberian Cat">
            <h3>Siberian</h3>
            <p>Immensely fluffy with a dense, triple winter coat and an agile personality.</p>
        </div>

        
        <div class="cat-breed">
            <img src="https://unsplash.com" alt="Maine Coon Cat">
            <h3>Maine Coon</h3>
            <p>Large stature with an iconic majestic plume tail and affectionate disposition.</p>
        </div>

    </div>

</body>
</html>
